name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public catalog
        run: node scripts/validate-catalog.mjs
      - name: Run automated tests
        run: node --test
      - name: Audit edited English lesson links (report only; repository baseline checked separately)
        run: node scripts/check-internal-links.mjs manuals/en/grammar/a1/topics/part-1-building-blocks.html
      - name: Install browser test dependencies
        run: npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test keyboard, responsive layout, accessibility, and print output
        run: node tests/browser-smoke.mjs
