name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public catalog
        run: node scripts/validate-catalog.mjs
      - name: Run automated tests
        run: node --test
      - name: Audit edited English lesson links (report only; repository baseline checked separately)
        run: node scripts/check-internal-links.mjs manuals/en/grammar/a1/topics/part-1-building-blocks.html
      - name: Install browser test dependencies
        run: npm install --no-save playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test keyboard, responsive layout, accessibility, and print output
        run: node tests/browser-smoke.mjs

  security-sql-proposal:
    name: Disposable PostgreSQL security proposal and rollback
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_test -v ON_ERROR_STOP=1 -f tests/security/postgres-fixture.sql
      - name: Apply proposed SQL in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_test -v ON_ERROR_STOP=1 -f docs/security-remediation-proposal.sql
      - name: Assert RPC authorization and default ACL behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_test -v ON_ERROR_STOP=1 -f tests/security/proposal-assertions.sql
      - name: Execute test-only rollback and verify fixture baseline
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_test -v ON_ERROR_STOP=1 -f tests/security/rollback-fixture.sql
