name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public catalog
        run: node scripts/validate-catalog.mjs
      - name: Run automated tests
        run: node --test
      - name: Audit local manual links (report only during baseline)
        run: node scripts/check-internal-links.mjs manuals
