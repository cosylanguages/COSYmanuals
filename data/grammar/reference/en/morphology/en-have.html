<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verb TO HAVE — COSYlanguages</title>
<link rel="icon" href="../../../images/logos/cosylanguages.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../css/base.css">
<link rel="stylesheet" href="../../../css/components.css">
<link rel="stylesheet" href="../../../css/layout.css"></head>
<body class="grammar-body">

<div class="grammar-header-new">
  <div>
    <div class="breadcrumb">Learner Area 🔐</div>
    <h1>Verb TO HAVE</h1>
  </div>
  <a href="../en.html" class="lang-tab active">← Roadmap</a>
</div>

<div class="grammar-layout">
<nav class="grammar-sidebar">
<a class="gs-item active" href="#present">Present Simple</a>
  <a class="gs-item" href="#quiz">Interactive Quiz</a>
  <div class="gs-label">Back to basics</div>
  <a class="gs-item" href="en-be.html">← Verb TO BE</a>
  <div class="gs-label" id="nav-label">Navigation</div>
  <a class="gs-item" href="../en.html">← Roadmap</a>
</nav>
<main class="grammar-main">
  <div class="grammar-section-title">English — Verb TO HAVE</div>
  <div class="g-card" id="present">
    <div class="g-card-title">Present Simple Forms</div>
    <table class="gtable">
      <tr class="section-row"><td colspan="3">Affirmative</td></tr>
      <tr><td class="row-label">I/You/We/They</td><td class="content"><span class="key-verb">have</span></td><td>I have a dog.</td></tr>
      <tr><td class="row-label">He/She/It</td><td class="content"><span class="key-verb">has</span></td><td>She has a car.</td></tr>
    </table>
  </div>

  <div class="g-quiz-card" id="quiz">
    <div class="g-card-title">Interactive Quiz</div>
    <div class="g-quiz-body">
      <div class="g-quiz-q" id="q1"><div class="g-quiz-prompt">We ___ a big house.</div><div class="g-quiz-options"><button class="g-quiz-opt" onclick="answer(this,'q1','have')">have</button><button class="g-quiz-opt" onclick="answer(this,'q1','has')">has</button></div><div class="quiz-feedback" id="fb-q1"></div></div>
      <div class="g-quiz-q" id="q2"><div class="g-quiz-prompt">He ___ two brothers.</div><div class="g-quiz-options"><button class="g-quiz-opt" onclick="answer(this,'q2','has')">has</button><button class="g-quiz-opt" onclick="answer(this,'q2','have')">have</button></div><div class="quiz-feedback" id="fb-q2"></div></div>
    </div>
  </div>
</main>
</div>
<script>
const answers={q1:'have',q2:'has'};
function answer(btn,qid,chosen){
  const correct=answers[qid]; const fb=document.getElementById('fb-'+qid);
  if(chosen===correct){ btn.classList.add('correct'); fb.textContent='Correct!'; }
  else { btn.classList.add('wrong'); fb.textContent='Not quite.'; }
}
</script>
<script src="../../../js/data/curriculum_data.js"></script>
<script>
(function() {
  const code = localStorage.getItem("student_course_code");
  if (code && typeof COURSES !== "undefined" && COURSES[code]) {
    const restrictedLevel = COURSES[code].level.toUpperCase();
    const lt = document.getElementById("roadmap-lang-tabs");
    if (lt) lt.style.display = "none";
    const arl = document.getElementById("all-roadmaps-link");
    if (arl) arl.style.display = "none";
    const nl = document.getElementById("nav-label");
    if (nl) nl.style.display = "none";

    document.querySelectorAll(".level-section").forEach(sec => {
      const badge = sec.querySelector(".level-badge");
      if (badge && !badge.textContent.includes(restrictedLevel)) {
        sec.style.display = "none";
        const id = sec.id;
        document.querySelectorAll(`.gs-item[href="#${id}"]`).forEach(item => item.style.display = "none");
      }
    });
    document.querySelectorAll(".grammar-sidebar").forEach(sb => {
        sb.querySelectorAll(".gs-label").forEach(label => {
            let next = label.nextElementSibling;
            let hasVisible = false;
            while(next && next.classList.contains("gs-item")) {
                if (next.style.display !== "none") { hasVisible = true; break; }
                next = next.nextElementSibling;
            }
            if (!hasVisible) label.style.display = "none";
        });
    });
  }
})();
</script>
<script src="../../../js/data/languages.js"></script>
<script src="../../../js/core/engine.js"></script>
<script src="../../../js/core/i18n.js"></script>
<script src="../../../js/core/ui.js"></script>
</body>
</html>
