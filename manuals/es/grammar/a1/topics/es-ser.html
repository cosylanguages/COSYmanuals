<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbo SER — COSYlanguages</title>
<link rel="icon" href="../../../images/logos/cosylanguages.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../shared/styles/tokens.css">
<link rel="stylesheet" href="../../../../../shared/styles/base.css">
<link rel="stylesheet" href="../../../../../shared/styles/components.css">
<link rel="stylesheet" href="../../../../../shared/styles/layout.css"></head>
<body class="grammar-body">

<div class="grammar-header-new">
  <div>
    <div class="breadcrumb">Learner Area 🔐</div>
    <h1>Verbo SER</h1>
  </div>
  <a href="../es.html" class="lang-tab active">← Programa</a>
</div>

<div class="grammar-layout">
<nav class="grammar-sidebar">
<a class="gs-item active" href="#present">Presente</a>
  <a class="gs-item" href="#quiz">Quiz Interactivo</a>
  <div class="gs-label">Próximos pasos</div>
  <a class="gs-item" href="#">→ Verbo ESTAR</a>
  <div class="gs-label">Navegación</div>
  <a class="gs-item" href="../es.html">← Programa</a>
</nav>
<main class="grammar-main">
  <div class="grammar-section-title">Español — Verbo SER</div>
  <div class="g-card" id="present">
    <div class="g-card-title">Presente de Indicativo</div>
    <table class="gtable">
      <tr><td class="row-label">yo</td><td class="content"><span class="key-verb">soy</span></td></tr>
      <tr><td class="row-label">tú</td><td class="content"><span class="key-verb">eres</span></td></tr>
      <tr><td class="row-label">él/ella/usted</td><td class="content"><span class="key-verb">es</span></td></tr>
      <tr><td class="row-label">nosotros/as</td><td class="content"><span class="key-verb">somos</span></td></tr>
      <tr><td class="row-label">vosotros/as</td><td class="content"><span class="key-verb">sois</span></td></tr>
      <tr><td class="row-label">ellos/ellas/ustedes</td><td class="content"><span class="key-verb">son</span></td></tr>
    </table>
  </div>

  <div class="g-quiz-card" id="quiz">
    <div class="g-card-title">Quiz Interactivo</div>
    <div class="g-quiz-body">
      <div class="g-quiz-q" id="q1">
        <div class="g-quiz-prompt">Nosotros ___ estudiantes.</div>
        <div class="g-quiz-options">
          <button class="g-quiz-opt" onclick="answer(this,'q1','somos')">somos</button>
          <button class="g-quiz-opt" onclick="answer(this,'q1','son')">son</button>
        </div>
        <div class="quiz-feedback" id="fb-q1"></div>
      </div>
    </div>
  </div>
</main>
</div>
<script>
const answers={q1:'somos'};
function answer(btn,qid,chosen){
  const correct=answers[qid]; const fb=document.getElementById('fb-'+qid);
  if(chosen===correct){ btn.classList.add('correct'); fb.textContent='¡Correcto!'; }
  else { btn.classList.add('wrong'); fb.textContent='No exactamente.'; }
}
</script>
<script src="../../../../../js/data/curriculum_data.js"></script>
<script>
(function() {
  const code = localStorage.getItem("student_course_code");
  if (code && typeof COURSES !== "undefined" && COURSES[code]) {
    const restrictedLevel = COURSES[code].level.toUpperCase();
    const lt = document.getElementById("roadmap-lang-tabs");
    if (lt) lt.style.display = "none";
    const arl = document.getElementById("all-roadmaps-link");
    if (arl) arl.style.display = "none";
    const nl = document.getElementById("nav-label");
    if (nl) nl.style.display = "none";

    document.querySelectorAll(".level-section").forEach(sec => {
      const badge = sec.querySelector(".level-badge");
      if (badge && !badge.textContent.includes(restrictedLevel)) {
        sec.style.display = "none";
        const id = sec.id;
        document.querySelectorAll(`.gs-item[href="#${id}"]`).forEach(item => item.style.display = "none");
      }
    });
    document.querySelectorAll(".grammar-sidebar").forEach(sb => {
        sb.querySelectorAll(".gs-label").forEach(label => {
            let next = label.nextElementSibling;
            let hasVisible = false;
            while(next && next.classList.contains("gs-item")) {
                if (next.style.display !== "none") { hasVisible = true; break; }
                next = next.nextElementSibling;
            }
            if (!hasVisible) label.style.display = "none";
        });
    });
  }
})();
</script>
<script src="../../../js/data/languages.js"></script>
<script src="../../../js/core/engine.js"></script>
<script src="../../../js/core/i18n.js"></script>
<script src="../../../js/core/ui.js"></script>
</body>
</html>
