<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSYmanuals - Authorized Course Catalog</title>
  <link rel="stylesheet" href="shared/styles/tokens.css">
  <link rel="stylesheet" href="shared/styles/base.css">
  <link rel="stylesheet" href="shared/styles/components.css">
  <link rel="stylesheet" href="shared/styles/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/js/auth-guard.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg, #0f172a);
      color: var(--color-text, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .header {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #38bdf8;
    }
    .user-info {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .user-role-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      background-color: #0284c7;
      color: #ffffff;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-left: 0.5rem;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f8fafc;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    .card-meta {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      background-color: #334155;
      color: #e2e8f0;
    }
    .badge-lang {
      background-color: #0369a1;
      color: #f0f9ff;
    }
    .badge-level {
      background-color: #15803d;
      color: #f0fdf4;
    }
    .card-link {
      display: inline-block;
      text-align: center;
      padding: 0.6rem 1rem;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }
    .card-link:hover {
      background-color: #0369a1;
    }
    .status-card {
      text-align: center;
      padding: 3rem;
      background-color: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>COSYmanuals</h1>
    <div id="user-info" class="user-info">Authenticating...</div>
  </header>

  <main class="container">
    <h2>Your Entitled Course Manuals</h2>
    <div id="catalog-container">
      <div class="status-card">
        <p>Loading your authorized curriculum catalog...</p>
      </div>
    </div>
  </main>

  <script>
    (async function () {
      const userInfoEl = document.getElementById('user-info');
      const catalogContainer = document.getElementById('catalog-container');

      // 1. Auth Guard Verification
      const authResult = await window.AuthGuard.checkAuth({ redirectOnFail: true });
      if (!authResult.authenticated) {
        return;
      }

      const session = authResult.session;
      const user = session.user;
      const supabaseClient = window.AuthGuard.getClient();

      // 2. Fetch User Profile for Entitlements
      let profile = { role: 'student', language_access: [], course_levels: [] };
      try {
        const { data: profileData } = await supabaseClient
          .from('profiles')
          .select('role, language_access, course_levels')
          .eq('id', user.id)
          .single();

        if (profileData) {
          profile = profileData;
        }
      } catch (err) {
        console.warn('Profile fetch warning:', err.message);
      }

      const isFounder = profile.role === 'founder' || profile.role === 'admin';
      userInfoEl.innerHTML = `Logged in as <strong>${escapeHtml(user.email)}</strong> <span class="user-role-badge">${escapeHtml(profile.role)}</span>`;

      // 3. Fetch Catalog Manuals from manual_content metadata
      try {
        const { data: manuals, error } = await supabaseClient
          .from('manual_content')
          .select('manual_id, language, level')
          .order('manual_id');

        if (error || !manuals) {
          catalogContainer.innerHTML = `<div class="status-card"><p>Unable to load course manuals catalog.</p></div>`;
          return;
        }

        // 4. Filter by Entitlements (unless Founder/Admin)
        const allowedLangs = Array.isArray(profile.language_access) ? profile.language_access.map(l => l.toLowerCase()) : [];
        const allowedLevels = Array.isArray(profile.course_levels) ? profile.course_levels.map(l => l.toUpperCase()) : [];

        const entitledManuals = manuals.filter(item => {
          if (isFounder) return true;
          const langMatch = allowedLangs.length === 0 || allowedLangs.includes(item.language.toLowerCase());
          const levelMatch = allowedLevels.length === 0 || allowedLevels.includes(item.level.toUpperCase());
          return langMatch && levelMatch;
        });

        if (entitledManuals.length === 0) {
          catalogContainer.innerHTML = `<div class="status-card"><p>No manuals found for your assigned language access level.</p></div>`;
          return;
        }

        // 5. Render Entitled Manual Cards
        let html = '<div class="grid">';
        for (const item of entitledManuals) {
          const title = formatManualTitle(item.manual_id, item.language, item.level);
          html += `
            <div class="card">
              <div>
                <div class="card-meta">
                  <span class="badge badge-lang">${escapeHtml(item.language.toUpperCase())}</span>
                  <span class="badge badge-level">${escapeHtml(item.level.toUpperCase())}</span>
                </div>
                <h3 class="card-title">${escapeHtml(title)}</h3>
              </div>
              <a class="card-link" href="manual-viewer.html?manual_id=${encodeURIComponent(item.manual_id)}">Open Manual →</a>
            </div>
          `;
        }
        html += '</div>';
        catalogContainer.innerHTML = html;

      } catch (err) {
        catalogContainer.innerHTML = `<div class="status-card"><p>Error fetching catalog: ${escapeHtml(err.message)}</p></div>`;
      }

      function formatManualTitle(id, lang, level) {
        const parts = id.split('-');
        const subject = parts[parts.length - 1] || 'manual';
        return `${lang.toUpperCase()} ${level.toUpperCase()} ${capitalize(subject)} Manual`;
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
