<script>
const VOCAB_MAP = {
  "starter": "A1",
  "elementary": "A2",
  "intermediate": "B1",
  "upper-intermediate": "B2",
  "advanced": "C1",
  "proficiency": "C2"
};

const VOCAB_CONFIG = {
  A1: { color: '#1565C0', lt: '#E3F2FD', name: 'Beginner', desc: 'Building blocks for real conversations' },
  A2: { color: '#6A1B9A', lt: '#F3E5F5', name: 'Elementary', desc: 'Language for real adult situations' },
  B1: { color: '#E65100', lt: '#FFF3E0', name: 'Intermediate', desc: 'Nuance, precision and real fluency' },
  B2: { color: '#AD1457', lt: '#FCE4EC', name: 'Upper-Intermediate', desc: 'Complex ideas, register and precision' },
  C1: { color: '#004D40', lt: '#E0F2F1', name: 'Advanced', desc: 'Precision, register and rhetorical skill' },
  C2: { color: '#1A237E', lt: '#E8EAF6', name: 'Proficiency', desc: 'Mastery — philosophical, rhetorical, exact' }
};

let VOCAB = {};

function initDynamicVocab() {
  const levels = ["A1", "A2", "B1", "B2", "C1", "C2"];
  levels.forEach(lv => {
    VOCAB[lv] = { ...VOCAB_CONFIG[lv], words: [] };
  });

  // Collect data from all potential sources to be robust
  const sources = [
    window.vocabularyData?.["en"],
    window.verbsData?.["en"],
    window.adjectivesData?.["en"]
  ].filter(Boolean).flat();

  // De-duplicate items based on word and level
  const uniqueItems = [];
  const seen = new Set();

  sources.forEach(item => {
    if (!item || !item.word || !item.level) return;
    const key = `${item.word.toLowerCase()}|${item.level}`;
    if (seen.has(key)) return;
    seen.add(key);
    uniqueItems.push(item);
  });

  uniqueItems.forEach(item => {
    const lvKey = VOCAB_MAP[item.level];
    if (lvKey && VOCAB[lvKey]) {
      // Find theme label
      let themeLabel = item.theme;
      if (window.themeConfig) {
        const levelConfig = window.themeConfig[item.level];
        if (levelConfig?.common_themes) {
          for (const topTheme in levelConfig.common_themes) {
            const subThemes = levelConfig.common_themes[topTheme];
            if (subThemes[item.theme]) {
              themeLabel = subThemes[item.theme];
              break;
            }
          }
        }
      }

      VOCAB[lvKey].words.push({
        w: item.word,
        pos: item.form,
        def: item.definitions?.[0]?.text || "",
        ex: item.definitions?.[0]?.examples?.[0] || "",
        pron: item.transcription ? `/${item.transcription}/` : "",
        err: item.subtext || "", // Use subtext as "info/error" for now
        topic: themeLabel || item.theme,
        raw: item // Keep raw for deeper integration if needed
      });
    }
  });
}

// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
let currentMode     = 'ref';
let score           = parseInt(localStorage.getItem('cosy_total_points') || '0');
let masteredWords   = new Set(JSON.parse(localStorage.getItem('vr_mastered')||'[]'));
let activeLevel     = 'A1';
const LEVELS        = ['A1','A2','B1','B2','C1','C2'];
const LEVEL_NAMES   = {A1:'Beginner',A2:'Elementary',
                       B1:'Intermediate',B2:'Upper-Intermediate',C1:'Advanced',C2:'Proficiency'};

// MC state per card
const mcState = {};
// Match state
let matchSelectedWord = null;
let matchMatched      = new Set();

// ══════════════════════════════════════════════════════════════════
// SCORE
// ══════════════════════════════════════════════════════════════════
function addScore(pts) {
  score += pts;
  localStorage.setItem('cosy_total_points', score);
  const el = document.getElementById('score-num');
  el.textContent = score;
  const w = document.getElementById('score-widget');
  w.style.transform = 'scale(1.15)';
  w.style.borderColor = '#FFE135';
  setTimeout(()=>{ w.style.transform=''; },350);
}

// ══════════════════════════════════════════════════════════════════
// MASTERY
// ══════════════════════════════════════════════════════════════════
function toggleMastery(word) {
  const key = word.toLowerCase();
  if (masteredWords.has(key)) masteredWords.delete(key);
  else { masteredWords.add(key); addScore(5); }
  localStorage.setItem('vr_mastered', JSON.stringify([...masteredWords]));
  updateStats();
  renderContent();
}

function updateStats() {
  const total = Object.values(VOCAB).reduce((a,lv)=>a+(lv.words?.length || 0),0);
  document.getElementById('total-words').textContent = total;
  document.getElementById('total-mastered').textContent = masteredWords.size;
}

// ══════════════════════════════════════════════════════════════════
// FUZZY MATCH
// ══════════════════════════════════════════════════════════════════
function fuzzy(input, target) {
  const a = input.trim().toLowerCase();
  const b = target.trim().toLowerCase();
  if (a === b) return 'exact';
  // levenshtein ≤ 1
  if (Math.abs(a.length-b.length) > 2) return 'wrong';
  let diff = 0;
  for (let i=0;i<Math.max(a.length,b.length);i++) if (a[i]!==b[i]) diff++;
  return diff <= 1 ? 'close' : 'wrong';
}

// ══════════════════════════════════════════════════════════════════
// MODE SWITCHER
// ══════════════════════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+mode)?.classList.add('active');
  // Update sidebar
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  renderContent();
}

// ══════════════════════════════════════════════════════════════════
// JUMP TO LEVEL
// ══════════════════════════════════════════════════════════════════
function jumpLevel(lv) {
  activeLevel = lv;
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  const el = document.getElementById('level-sec-'+lv);
  if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
  else renderContent();
}

// ══════════════════════════════════════════════════════════════════
// GLOBAL SEARCH
// ══════════════════════════════════════════════════════════════════
function globalSearch(query) {
  if (!query.trim()) { renderContent(); return; }
  const q = query.toLowerCase();
  const area = document.getElementById('content-area');
  const results = [];
  LEVELS.forEach(lv => {
    VOCAB[lv].words.forEach(item => {
      if (item.w.toLowerCase().includes(q) ||
          item.def.toLowerCase().includes(q) ||
          item.ex.toLowerCase().includes(q) ||
          item.topic.toLowerCase().includes(q)) {
        results.push({...item, level:lv});
      }
    });
  });
  if (!results.length) {
    area.innerHTML = `<div style="text-align:center;padding:3rem;font-size:.9rem;color:rgba(0,0,0,.5)">No results for "${query}"</div>`;
    return;
  }
  area.innerHTML = `
    <div class="level-header">
      <span class="level-badge" style="background:#555">🔍</span>
      <span class="level-title">Search results for "${query}" (${results.length})</span>
    </div>
    ${buildRefTable(results, 'search')}`;
}

// ══════════════════════════════════════════════════════════════════
// RENDER CONTENT
// ══════════════════════════════════════════════════════════════════
function renderContent() {
  const area = document.getElementById('content-area');
  let html = '';
  LEVELS.forEach(lv => {
    const data = VOCAB[lv];
    html += renderLevel(lv, data);
  });
  area.innerHTML = html;
  // Re-attach events after render
  attachFlipEvents();
  updateStats();
}

function renderLevel(lv, data) {
  const badge = `<span class="level-badge" style="background:${data.color}">${lv}</span>`;
  const progress = Math.round(
    data.words.filter(w=>masteredWords.has(w.w.toLowerCase())).length / data.words.length * 100
  );

  let inner = '';
  if (currentMode === 'ref')   inner = buildRef(data.words, lv);
  if (currentMode === 'flip')  inner = buildFlip(data.words, lv);
  if (currentMode === 'type')  inner = buildType(data.words, lv);
  if (currentMode === 'mc')    inner = buildMC(data.words, lv);
  if (currentMode === 'match') inner = buildMatch(data.words, lv);

  return `
    <div class="level-section" id="level-sec-${lv}">
      <div class="level-header">
        ${badge}
        <span class="level-title">${data.name}</span>
        <span class="level-desc">${data.desc}</span>
      </div>
      <div class="level-progress">
        <div class="lp-fill" style="width:${progress}%;background:${data.color}"></div>
      </div>
      ${inner}
      <hr class="sec-div">
    </div>`;
}

// ── REFERENCE TABLE ──────────────────────────────────────────────
function buildRef(words, lv) {
  return buildRefTable(words, lv);
}

function buildRefTable(words, lv) {
  const rows = words.map(item => {
    const key       = item.w.toLowerCase();
    const isMast    = masteredWords.has(key);
    const mastClass = isMast ? ' mastered' : '';
    const stars     = isMast ? '⭐ done' : '☆ learn';
    return `<tr class="${mastClass}" data-word="${key}">
      <td>
        <span class="rt-word">${item.w}</span>
        <span class="rt-pos">${item.pos}</span>
        <span class="rt-topic">${item.topic}</span>
      </td>
      <td class="rt-def">${item.def}</td>
      <td>
        <span class="rt-ex">${item.ex}</span>
        ${item.pron ? `<span class="rt-pron">${item.pron}</span>` : ''}
      </td>
      <td class="rt-error">${item.err}</td>
      <td>
        <div class="rt-score" onclick="toggleMastery('${item.w}')">
          <div class="stars">${isMast ? '⭐' : '○'}</div>
          <div style="font-size:.6rem;margin-top:.1rem">${stars}</div>
        </div>
      </td>
    </tr>`;
  }).join('');
  return `
    <table class="ref-table">
      <thead>
        <tr>
          <th style="width:14%">Word</th>
          <th style="width:26%">Definition</th>
          <th style="width:28%">Example & pronunciation</th>
          <th style="width:28%">Common learner error</th>
          <th style="width:4%"></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── FLIP CARDS ────────────────────────────────────────────────────
function buildFlip(words, lv) {
  const cards = words.map((item,i) => `
    <div class="flip-wrap" id="flip-${lv}-${i}" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-front">
          <div class="fw">${item.w}</div>
          <div class="fp">${item.pos} · ${item.pron || ''}</div>
          <div class="flip-badge">${item.topic}</div>
        </div>
        <div class="flip-back">
          <div class="fd">${item.def}</div>
          <div class="fe">${item.ex}</div>
        </div>
      </div>
    </div>`).join('');
  return `
    <div class="ex-controls">
      <span style="font-size:.78rem;font-weight:700;color:rgba(0,0,0,.55)">Click a card to reveal the definition</span>
      <button class="ex-btn secondary" onclick="flipAll('${lv}',${words.length})">Flip all</button>
      <button class="ex-btn secondary" onclick="resetFlip('${lv}',${words.length})">Reset</button>
    </div>
    <div class="flip-grid">${cards}</div>`;
}

function attachFlipEvents() {} // cards use onclick inline

window.flipAll = function(lv, n) {
  for (let i=0;i<n;i++) document.getElementById(`flip-${lv}-${i}`)?.classList.add('flipped');
};
window.resetFlip = function(lv, n) {
  for (let i=0;i<n;i++) document.getElementById(`flip-${lv}-${i}`)?.classList.remove('flipped');
};

// ── TYPING EXERCISE ───────────────────────────────────────────────
function buildType(words, lv) {
  const cards = words.map((item,i) => {
    const id = `type-${lv}-${i}`;
    // Blank the word in the example
    const re = new RegExp('\\b'+item.w.replace(/[-[\]{}()*+?.,\\^$|#\s]/g,'\\$&')+'s?\\b','i');
    const blankedEx = item.ex.replace(re, `<span class="blank">${'_'.repeat(item.w.length)}</span>`);
    return `
      <div class="type-card">
        <div class="tc-prompt">Type the word</div>
        <div class="tc-def">${item.def}</div>
        <div class="tc-ex">${blankedEx}</div>
        ${item.pron ? `<div class="tc-pron">${item.pron}</div>` : ''}
        <div class="tc-input-row">
          <input class="tc-input" type="text" id="${id}"
            placeholder="Type the word…"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            data-answer="${item.w}" data-level="${lv}" data-idx="${i}"
            onkeydown="if(event.key==='Enter')checkType('${id}','${item.w.replace(/'/g,"\\'")}','${lv}')">
          <button class="tc-btn" onclick="checkType('${id}','${item.w.replace(/'/g,"\\'")}','${lv}')">Check ✓</button>
          <button class="tc-btn hint-btn" onclick="typeHint('${id}','${item.w.replace(/'/g,"\\'")}')">💡</button>
        </div>
        <div class="tc-feedback" id="fb-${id}"></div>
      </div>`;
  }).join('');
  return `
    <div class="ex-controls">
      <span style="font-size:.78rem;font-weight:700;color:rgba(0,0,0,.55)">
        Type the word that matches each definition
      </span>
      <button class="ex-btn secondary" onclick="resetType('${lv}',${words.length})">↺ Reset all</button>
    </div>
    <div class="typing-exercise">${cards}</div>`;
}

window.checkType = function(id, answer, lv) {
  const input = document.getElementById(id);
  const fb    = document.getElementById('fb-'+id);
  if (!input||!fb) return;
  const result = fuzzy(input.value, answer);
  input.classList.remove('correct','wrong','close');
  fb.classList.remove('show','ok','err','near');
  if (result === 'exact') {
    input.classList.add('correct');
    fb.textContent = '✅ Correct!';
    fb.classList.add('show','ok');
    input.disabled = true;
    addScore(10);
  } else if (result === 'close') {
    input.classList.add('close');
    fb.textContent = `Almost! Check spelling — answer: "${answer}"`;
    fb.classList.add('show','near');
    addScore(3);
  } else {
    input.classList.add('wrong');
    fb.textContent = `❌ The answer is: "${answer}"`;
    fb.classList.add('show','err');
  }
};

window.typeHint = function(id, answer) {
  const input = document.getElementById(id);
  if (!input) return;
  const current = input.value.length;
  if (current < answer.length)
    input.placeholder = `${answer[0].toUpperCase()}${'_'.repeat(answer.length-1)} (${answer.length} letters)`;
  if (current === 0) input.value = answer[0];
};

window.resetType = function(lv, n) {
  for (let i=0;i<n;i++) {
    const id = `type-${lv}-${i}`;
    const input = document.getElementById(id);
    const fb    = document.getElementById('fb-'+id);
    if (input) { input.value=''; input.disabled=false; input.classList.remove('correct','wrong','close'); }
    if (fb)    { fb.classList.remove('show','ok','err','near'); }
  }
};

// ── MULTIPLE CHOICE ───────────────────────────────────────────────
function buildMC(words, lv) {
  const cards = words.map((item,i) => {
    const stateKey = `${lv}-${i}`;
    // Pick 3 distractors from other words in same or adjacent levels
    const all  = Object.values(VOCAB).flatMap(d=>d.words);
    const pool = all.filter(w=>w.w!==item.w);
    const shuffle = arr => [...arr].sort(()=>Math.random()-.5);
    const distractors = shuffle(pool).slice(0,3).map(w=>w.def.length>80?w.def.slice(0,80)+'…':w.def);
    const correct = item.def.length>80 ? item.def.slice(0,80)+'…' : item.def;
    const options = shuffle([correct, ...distractors]);

    const opts = options.map((opt,oi)=>`
      <div class="mc-opt" data-option="${oi}" data-correct="${opt===correct}"
           onclick="checkMC(this,'${stateKey}')">
        ${opt}
      </div>`).join('');

    return `
      <div class="mc-card" id="mc-${stateKey}">
        <div class="mc-word-display">${item.w} <span style="font-size:.9rem;opacity:.5">${item.pron||''}</span></div>
        <div class="tc-prompt">Which definition is correct?</div>
        <div class="mc-options">${opts}</div>
        <div class="tc-feedback" id="mc-fb-${stateKey}"></div>
      </div>`;
  }).join('');
  return `<div class="mc-exercise">${cards}</div>`;
}

window.checkMC = function(btn, key) {
  if (mcState[key]) return; // already answered
  mcState[key] = true;
  const correct = btn.dataset.correct === 'true';
  const card    = document.getElementById('mc-'+key);
  const fb      = document.getElementById('mc-fb-'+key);
  card.querySelectorAll('.mc-opt').forEach(b=>{
    b.style.pointerEvents='none';
    if (b.dataset.correct==='true') b.classList.add('correct');
  });
  if (correct) {
    btn.classList.add('correct');
    if (fb) { fb.textContent='✅ Correct! +8 points'; fb.classList.add('show','ok'); }
    addScore(8);
  } else {
    btn.classList.add('wrong');
    if (fb) { fb.textContent='❌ Not quite — correct answer highlighted in green.'; fb.classList.add('show','err'); }
  }
};

// ── MATCHING PAIRS ────────────────────────────────────────────────
function buildMatch(words, lv) {
  const subset = words.slice(0, Math.min(8, words.length));
  const shuffle = arr => [...arr].sort(()=>Math.random()-.5);
  const shuffledWords = shuffle(subset.map((_,i)=>i));
  const shuffledDefs  = shuffle(subset.map((_,i)=>i));

  const wordCol = shuffledWords.map(i=>`
    <div class="match-item match-word" data-idx="${i}" data-type="word"
         id="mw-${lv}-${i}" onclick="matchClick(this,'${lv}')">
      ${subset[i].w}
    </div>`).join('');
  const defCol = shuffledDefs.map(i=>`
    <div class="match-item match-def" data-idx="${i}" data-type="def"
         id="md-${lv}-${i}" onclick="matchClick(this,'${lv}')">
      ${subset[i].def.length>70?subset[i].def.slice(0,70)+'…':subset[i].def}
    </div>`).join('');

  return `
    <div class="ex-controls">
      <span style="font-size:.78rem;font-weight:700;color:rgba(0,0,0,.55)">
        Match each word to its definition
      </span>
      <button class="ex-btn secondary" onclick="resetMatch('${lv}',${subset.length})">↺ Reset</button>
      <span class="ex-score-inline" id="match-score-${lv}">0 / ${subset.length}</span>
    </div>
    <div class="match-exercise">
      <div class="match-container">
        <div>
          <div class="match-col-title">📝 Words</div>
          <div class="match-items">${wordCol}</div>
        </div>
        <div>
          <div class="match-col-title">📖 Definitions</div>
          <div class="match-items">${defCol}</div>
        </div>
      </div>
    </div>`;
}

let matchWord = null; // {lv, idx, el}
window.matchClick = function(el, lv) {
  if (el.classList.contains('matched-ok')) return;
  const type = el.dataset.type;
  const idx  = parseInt(el.dataset.idx);

  if (type === 'word') {
    if (matchWord) matchWord.el.classList.remove('selected-word');
    matchWord = {lv, idx, el};
    el.classList.add('selected-word');
  } else {
    // def selected — check against selected word
    if (!matchWord || matchWord.lv !== lv) {
      el.classList.toggle('selected-def');
      return;
    }
    // evaluate
    const correct = matchWord.idx === idx;
    if (correct) {
      el.classList.add('matched-ok');
      matchWord.el.classList.add('matched-ok');
      addScore(12);
      // update score counter
      const sc = document.getElementById(`match-score-${lv}`);
      if (sc) {
        const cur = parseInt(sc.textContent.split('/')[0]) + 1;
        const tot = sc.textContent.split('/')[1].trim();
        sc.textContent = `${cur} / ${tot}`;
        if (cur === parseInt(tot)) {
          sc.style.color = '#2E7D32';
          sc.style.fontWeight = '900';
          sc.textContent += ' ✅';
        }
      }
    } else {
      el.classList.add('matched-bad');
      matchWord.el.classList.add('matched-bad');
      setTimeout(()=>{
        el.classList.remove('matched-bad','selected-def');
        matchWord.el.classList.remove('matched-bad','selected-word');
        matchWord = null;
      }, 600);
      return;
    }
    matchWord = null;
    document.querySelectorAll('.match-item.selected-def').forEach(b=>b.classList.remove('selected-def'));
  }
};

window.resetMatch = function(lv, n) {
  matchWord = null;
  for (let i=0;i<n;i++) {
    const w = document.getElementById(`mw-${lv}-${i}`);
    const d = document.getElementById(`md-${lv}-${i}`);
    if (w) w.classList.remove('matched-ok','matched-bad','selected-word');
    if (d) d.classList.remove('matched-ok','matched-bad','selected-def');
  }
  const sc = document.getElementById(`match-score-${lv}`);
  if (sc) { const tot=sc.textContent.split('/')[1]?.split(' ')[0]?.trim()||n;
    sc.textContent=`0 / ${tot}`; sc.style.color=''; sc.style.fontWeight=''; }
};

// ══════════════════════════════════════════════════════════════════
// SCROLL → SIDEBAR HIGHLIGHT
// ══════════════════════════════════════════════════════════════════
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      activeLevel = e.target.id.replace('level-sec-','');
    }
  });
}, {threshold:.15});

document.addEventListener('DOMContentLoaded', () => {
  initDynamicVocab();
  document.getElementById('score-num').textContent = score;
  renderContent();

  // Handle auto-search from URL parameter
  const urlParams = new URLSearchParams(window.location.search);
  const searchQuery = urlParams.get('search');
  if (searchQuery) {
    const searchInput = document.getElementById('global-search');
    if (searchInput) {
      searchInput.value = searchQuery;
      globalSearch(searchQuery);
    }
  }

  // Observe sections after render
  setTimeout(() => {
    LEVELS.forEach(lv => {
      const el = document.getElementById('level-sec-'+lv);
      if (el) io.observe(el);
    });
  }, 100);
});
